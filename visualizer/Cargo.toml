[package]
name = "proto-visualizer"
version = "0.1.0"
edition = "2021"
description = "Interactive Protobuf binary encoding visualizer"

[[bin]]
name = "proto-visualizer"
path = "src/main.rs"

[dependencies]
protoc-rs-proto-gen = { git = "https://github.com/Shuozeli/protobuf-rs.git" }
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
flate2 = "1"
base64 = "0.22"
log = "0.4"
thiserror = "2"
serde_json = "1"

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = "0.15"
eframe = { version = "0.31", features = ["accesskit", "wayland", "x11"] }

# Web-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "History",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "FileReader",
    "Blob",
    "File",
    "FileList",
    "Event",
    "InputEvent",
    "Location",
    "Response",
    "Headers",
    "Navigator",
    "Clipboard",
] }
eframe = { version = "0.31", features = ["web_screen_reader"] }
